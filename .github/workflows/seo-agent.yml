name: Weekly SEO Agent

# Replaces: .github/workflows/seo-audit.yml (which is now manual-trigger only)
#
# This is the primary automated SEO pipeline. It runs weekly and:
#   1. Audits ISR violations, missing canonicals, PageSpeed, Vercel 500s
#   2. Pulls Google Search Console data (28-day CTR + query data)
#   3. Uses Claude to rewrite meta title/description for low-CTR templates
#   4. Reports schema gaps (structured data improvements needed)
#   5. Submits updated pages to Google Indexing API
#   6. Re-submits sitemap to Google Search Console
#   7. Opens a PR if any changes were made
#
# Required GitHub secrets:
#   ANTHROPIC_API_KEY             — Claude API key
#   GOOGLE_SERVICE_ACCOUNT_EMAIL  — GCP service account email
#   GOOGLE_PRIVATE_KEY            — GCP service account private key (RSA PEM, \n escaped)
#   GOOGLE_SITE_URL               — https://www.westsiderealty.in
#   GH_PAT                        — GitHub PAT with repo + PR write permissions
#   SUPABASE_URL                  — Supabase project URL (NEXT_PUBLIC_SUPABASE_URL)
#   SUPABASE_SERVICE_ROLE_KEY     — Supabase service role key (bypasses RLS)
#   PAGESPEED_API_KEY             — Google PageSpeed Insights API key (optional)
#   VERCEL_TOKEN                  — Vercel API token (optional, for 500 error check)
#   VERCEL_PROJECT_ID             — Vercel project ID (optional)
#   VERCEL_TEAM_ID                — Vercel team ID (optional)
#   SERPAPI_KEY                   — SerpAPI key (optional, for competitor keyword data)

on:
  schedule:
    # Every Sunday at 11 PM IST (5:30 PM UTC)
    - cron: "30 17 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: false
        default: "full"
        type: choice
        options:
          - full           # Phase 1 (code) + Phase 2 (GSC) + Phase 3 (index)
          - code-only      # Phase 1 only — ISR, canonicals, PageSpeed
          - gsc-only       # Phase 2 only — CTR audit + meta optimization
          - dry-run        # Audit + analyze only, no file changes or API calls

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-agent:
    name: SEO Agent (${{ github.event.inputs.mode || 'full' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Determine agent flags
        id: flags
        run: |
          MODE="${{ github.event.inputs.mode || 'full' }}"
          FLAGS=""
          if [ "$MODE" = "code-only" ]; then FLAGS="--code-only"; fi
          if [ "$MODE" = "gsc-only" ]; then FLAGS="--gsc-only"; fi
          if [ "$MODE" = "dry-run" ]; then FLAGS="--dry-run"; fi
          echo "flags=$FLAGS" >> $GITHUB_OUTPUT
          echo "Agent mode: $MODE (flags: '$FLAGS')"

      - name: Run SEO Agent
        id: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          GOOGLE_SITE_URL: ${{ secrets.GOOGLE_SITE_URL || 'https://www.westsiderealty.in' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: |
          node scripts/seo-agent/agent.mjs ${{ steps.flags.outputs.flags }} > /tmp/agent-summary.json 2>&1 || true
          echo "Agent run complete"

          # Parse summary for GitHub Actions outputs
          HAS_CHANGES=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.hasChanges ? 'true' : 'false');
            } catch { console.log('false'); }
          " 2>/dev/null || echo "false")
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT

          META_FIXED=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.metaTemplatesOptimized || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "meta_fixed=$META_FIXED" >> $GITHUB_OUTPUT

          CODE_FIXED=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.codeFixesApplied || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "code_fixed=$CODE_FIXED" >> $GITHUB_OUTPUT

          PRIORITY_PAGES=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.priorityPagesFound || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "priority_pages=$PRIORITY_PAGES" >> $GITHUB_OUTPUT

          ON_PAGE_ISSUES=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.onPageIssues || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "on_page_issues=$ON_PAGE_ISSUES" >> $GITHUB_OUTPUT

          DB_CONTENT_ISSUES=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.dbContentIssues || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "db_content_issues=$DB_CONTENT_ISSUES" >> $GITHUB_OUTPUT

          DB_CONTENT_CRITICAL=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.dbContentCritical || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "db_content_critical=$DB_CONTENT_CRITICAL" >> $GITHUB_OUTPUT

          CTR_DROP_ALERTS=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.ctrDropAlerts || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "ctr_drop_alerts=$CTR_DROP_ALERTS" >> $GITHUB_OUTPUT

          KEYWORD_GAPS=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.keywordGaps || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "keyword_gaps=$KEYWORD_GAPS" >> $GITHUB_OUTPUT

          QUICK_WINS=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.quickWins || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "quick_wins=$QUICK_WINS" >> $GITHUB_OUTPUT

          MISSING_LOCALITIES=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.missingLocalities || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "missing_localities=$MISSING_LOCALITIES" >> $GITHUB_OUTPUT

          KEYWORDS_TRACKED=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.keywordsTracked || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "keywords_tracked=$KEYWORDS_TRACKED" >> $GITHUB_OUTPUT

          KEYWORD_DROPS=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.keywordDrops || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "keyword_drops=$KEYWORD_DROPS" >> $GITHUB_OUTPUT

          FAQ_FILES=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.faqFilesUpdated || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "faq_files=$FAQ_FILES" >> $GITHUB_OUTPUT

          SNIPPET_OPPS=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.featuredSnippetOpportunities || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "snippet_opps=$SNIPPET_OPPS" >> $GITHUB_OUTPUT

          LOW_DIFF=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.lowDifficultyKeywords || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "low_diff_keywords=$LOW_DIFF" >> $GITHUB_OUTPUT

          CONTENT_LOW=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.contentLowScorePages || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "content_low_score=$CONTENT_LOW" >> $GITHUB_OUTPUT

          CRUX_POOR=$(node -e "
            try {
              const s = JSON.parse(require('fs').readFileSync('/tmp/agent-summary.json','utf8'));
              console.log(s.cruxUrlsPoor || 0);
            } catch { console.log(0); }
          " 2>/dev/null || echo "0")
          echo "crux_poor=$CRUX_POOR" >> $GITHUB_OUTPUT

      - name: Check for file changes
        id: changes
        run: |
          git diff --quiet src/ && echo "has_file_changes=false" >> $GITHUB_OUTPUT || echo "has_file_changes=true" >> $GITHUB_OUTPUT

      - name: Create PR branch and commit
        if: |
          steps.changes.outputs.has_file_changes == 'true' &&
          github.event.inputs.mode != 'dry-run'
        run: |
          WEEK=$(date +%Y-W%V)
          BRANCH="seo-agent/${WEEK}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/
          git commit -m "chore(seo): automated optimization for week ${WEEK}

          - Code fixes: ${{ steps.agent.outputs.code_fixed }} applied
          - Meta templates optimized: ${{ steps.agent.outputs.meta_fixed }}
          - Priority pages identified: ${{ steps.agent.outputs.priority_pages }}

          Generated by weekly SEO agent.
          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_ENV

      - name: Open pull request
        if: |
          steps.changes.outputs.has_file_changes == 'true' &&
          github.event.inputs.mode != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          WEEK=$(date +%Y-W%V)
          PR_BODY=""
          if [ -f ".seo-pr-body.md" ]; then
            PR_BODY=$(cat .seo-pr-body.md)
          else
            PR_BODY="## SEO Agent — Week ${WEEK}\n\nAutomated SEO optimization. See workflow logs for details."
          fi

          gh pr create \
            --title "chore(seo): weekly optimization — week ${WEEK}" \
            --body "$PR_BODY" \
            --base main \
            --head "seo-agent/${WEEK}" \
            --label "seo,automated" 2>/dev/null || \
          gh pr create \
            --title "chore(seo): weekly optimization — week ${WEEK}" \
            --body "$PR_BODY" \
            --base main \
            --head "seo-agent/${WEEK}"

      - name: Post summary — changes found
        if: steps.changes.outputs.has_file_changes == 'true'
        run: |
          echo "## SEO Agent Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 **Code fixes applied:** ${{ steps.agent.outputs.code_fixed }}" >> $GITHUB_STEP_SUMMARY
          echo "✍️ **Meta templates optimized:** ${{ steps.agent.outputs.meta_fixed }}" >> $GITHUB_STEP_SUMMARY
          echo "📄 **FAQ schema files updated:** ${{ steps.agent.outputs.faq_files }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Content Quality" >> $GITHUB_STEP_SUMMARY
          echo "🗄️ **DB content issues:** ${{ steps.agent.outputs.db_content_issues }} (${{ steps.agent.outputs.db_content_critical }} critical)" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **On-page issues found:** ${{ steps.agent.outputs.on_page_issues }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Keyword Intelligence" >> $GITHUB_STEP_SUMMARY
          echo "📉 **CTR priority pages:** ${{ steps.agent.outputs.priority_pages }}" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **CTR drop alerts (WoW):** ${{ steps.agent.outputs.ctr_drop_alerts }}" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Keyword gaps found:** ${{ steps.agent.outputs.keyword_gaps }}" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **Quick win pages (pos 11-20):** ${{ steps.agent.outputs.quick_wins }}" >> $GITHUB_STEP_SUMMARY
          echo "🗺️ **Missing locality pages:** ${{ steps.agent.outputs.missing_localities }}" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Keywords tracked:** ${{ steps.agent.outputs.keywords_tracked }} (${{ steps.agent.outputs.keyword_drops }} dropped)" >> $GITHUB_STEP_SUMMARY
          echo "🟢 **Low-difficulty keyword wins:** ${{ steps.agent.outputs.low_diff_keywords }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Page Experience" >> $GITHUB_STEP_SUMMARY
          echo "✨ **Featured snippet opportunities:** ${{ steps.agent.outputs.snippet_opps }}" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Content low-score pages (<50):** ${{ steps.agent.outputs.content_low_score }}" >> $GITHUB_STEP_SUMMARY
          echo "❌ **CrUX poor pages (real users):** ${{ steps.agent.outputs.crux_poor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "PR opened for review → merge after checking the diff." >> $GITHUB_STEP_SUMMARY
          if [ -f ".seo-pr-body.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat .seo-pr-body.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Post summary — no changes
        if: steps.changes.outputs.has_file_changes == 'false'
        run: |
          echo "## SEO Agent Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ No file changes this week." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Content Quality" >> $GITHUB_STEP_SUMMARY
          echo "🗄️ **DB content issues:** ${{ steps.agent.outputs.db_content_issues }} (${{ steps.agent.outputs.db_content_critical }} critical)" >> $GITHUB_STEP_SUMMARY
          echo "🔍 **On-page issues found:** ${{ steps.agent.outputs.on_page_issues }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Keyword Intelligence" >> $GITHUB_STEP_SUMMARY
          echo "📉 **CTR priority pages:** ${{ steps.agent.outputs.priority_pages }}" >> $GITHUB_STEP_SUMMARY
          echo "⚠️ **CTR drop alerts (WoW):** ${{ steps.agent.outputs.ctr_drop_alerts }}" >> $GITHUB_STEP_SUMMARY
          echo "🎯 **Keyword gaps found:** ${{ steps.agent.outputs.keyword_gaps }}" >> $GITHUB_STEP_SUMMARY
          echo "⚡ **Quick win pages (pos 11-20):** ${{ steps.agent.outputs.quick_wins }}" >> $GITHUB_STEP_SUMMARY
          echo "🗺️ **Missing locality pages:** ${{ steps.agent.outputs.missing_localities }}" >> $GITHUB_STEP_SUMMARY
          echo "📊 **Keywords tracked:** ${{ steps.agent.outputs.keywords_tracked }} (${{ steps.agent.outputs.keyword_drops }} dropped)" >> $GITHUB_STEP_SUMMARY
          echo "🟢 **Low-difficulty keyword wins:** ${{ steps.agent.outputs.low_diff_keywords }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Page Experience" >> $GITHUB_STEP_SUMMARY
          echo "✨ **Featured snippet opportunities:** ${{ steps.agent.outputs.snippet_opps }}" >> $GITHUB_STEP_SUMMARY
          echo "📝 **Content low-score pages (<50):** ${{ steps.agent.outputs.content_low_score }}" >> $GITHUB_STEP_SUMMARY
          echo "❌ **CrUX poor pages (real users):** ${{ steps.agent.outputs.crux_poor }}" >> $GITHUB_STEP_SUMMARY
          echo "(Template metadata is already optimal — no file changes needed)" >> $GITHUB_STEP_SUMMARY
          if [ -f ".seo-pr-body.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat .seo-pr-body.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Notify Slack
        if: always() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ "${{ steps.changes.outputs.has_file_changes }}" = "true" ]; then
            ICON="🔧"
            STATUS="PR opened: ${{ steps.agent.outputs.code_fixed }} code fix(es), ${{ steps.agent.outputs.meta_fixed }} meta update(s), ${{ steps.agent.outputs.faq_files }} FAQ file(s). ${{ steps.agent.outputs.keyword_gaps }} keyword gaps | ${{ steps.agent.outputs.quick_wins }} quick wins | ${{ steps.agent.outputs.db_content_critical }} critical content issues"
            COLOR="#36a64f"
          else
            ICON="✅"
            STATUS="No file changes. ${{ steps.agent.outputs.keyword_gaps }} keyword gaps | ${{ steps.agent.outputs.quick_wins }} quick wins | ${{ steps.agent.outputs.ctr_drop_alerts }} CTR drop alerts | ${{ steps.agent.outputs.keywords_tracked }} keywords tracked"
            COLOR="#2eb886"
          fi
          WEEK=$(date +%Y-W%V)
          curl -s -X POST "$SLACK_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"title\": \"$ICON SEO Agent — Week $WEEK\",
                \"text\": \"$STATUS\",
                \"footer\": \"westsiderealty.in | <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"
              }]
            }"
