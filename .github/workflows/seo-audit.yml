name: Weekly SEO Audit & Auto-Fix

on:
  schedule:
    # Every Sunday at 11 PM IST (5:30 PM UTC)
    - cron: "30 17 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — audit only, no PR"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  seo-audit-fix:
    name: SEO Audit + Auto-Fix
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run SEO audit
        id: audit
        env:
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: |
          node scripts/seo-audit/audit.mjs > /tmp/seo-findings.json 2>&1 || true
          # audit exits 1 when auto-fixable issues exist — that's expected
          echo "Audit complete"
          # Count issues for decision
          AUTO_FIXABLE=$(node -e "
            const f = JSON.parse(require('fs').readFileSync('/tmp/seo-findings.json','utf8'));
            console.log(f.summary.isrViolations + f.summary.missingCanonicals + f.summary.missingKeywords);
          " 2>/dev/null || echo "0")
          echo "auto_fixable=$AUTO_FIXABLE" >> $GITHUB_OUTPUT
          echo "Auto-fixable issues: $AUTO_FIXABLE"

      - name: Apply auto-fixes
        id: fix
        if: steps.audit.outputs.auto_fixable != '0' && inputs.dry_run != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat /tmp/seo-findings.json | node scripts/seo-audit/fix.mjs > /tmp/fix-result.json 2>/tmp/fix-log.txt
          cat /tmp/fix-log.txt
          FIXES_APPLIED=$(node -e "
            const r = JSON.parse(require('fs').readFileSync('/tmp/fix-result.json','utf8'));
            console.log(r.total);
          " 2>/dev/null || echo "0")
          echo "fixes_applied=$FIXES_APPLIED" >> $GITHUB_OUTPUT
          echo "Fixes applied: $FIXES_APPLIED"

      - name: Generate PR body for dry run
        if: inputs.dry_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          cat /tmp/seo-findings.json | node scripts/seo-audit/fix.mjs > /dev/null 2>&1 || true
          echo "Dry run complete — no files modified"

      - name: Check for changes
        id: changes
        run: |
          git diff --quiet && echo "has_changes=false" >> $GITHUB_OUTPUT || echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Create PR branch and commit
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        run: |
          WEEK=$(date +%Y-W%V)
          BRANCH="seo-auto-fix/${WEEK}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add src/
          git commit -m "chore(seo): automated fixes for week ${WEEK}

          Auto-applied ${{ steps.fix.outputs.fixes_applied }} SEO fixes.
          Generated by weekly SEO audit workflow.

          Co-Authored-By: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> $GITHUB_ENV

      - name: Open pull request
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          WEEK=$(date +%Y-W%V)
          PR_BODY=""
          if [ -f ".seo-pr-body.md" ]; then
            PR_BODY=$(cat .seo-pr-body.md)
          else
            PR_BODY="## SEO Auto-Fix — Week ${WEEK}\n\nAutomated SEO fixes applied by weekly audit workflow.\n\nSee audit findings in workflow logs."
          fi

          gh pr create \
            --title "chore(seo): automated fixes for week ${WEEK}" \
            --body "$PR_BODY" \
            --base main \
            --head "seo-auto-fix/${WEEK}" \
            --label "seo,automated" || \
          gh pr create \
            --title "chore(seo): automated fixes for week ${WEEK}" \
            --body "$PR_BODY" \
            --base main \
            --head "seo-auto-fix/${WEEK}"

      - name: Post audit summary (no fixes needed)
        if: steps.audit.outputs.auto_fixable == '0'
        run: |
          echo "## SEO Audit Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ No auto-fixable issues found this week." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "/tmp/seo-findings.json" ]; then
            node -e "
              const f = JSON.parse(require('fs').readFileSync('/tmp/seo-findings.json','utf8'));
              console.log('**PageSpeed issues:** ' + f.summary.pageSpeedIssues);
              console.log('**Vercel 500 paths:** ' + f.summary.vercel500Paths);
              console.log('**Sitemap issues:** ' + f.summary.sitemapIssues);
            " >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          fi

      - name: Post audit summary (fixes applied)
        if: steps.changes.outputs.has_changes == 'true' && inputs.dry_run != 'true'
        run: |
          echo "## SEO Audit Result" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔧 Applied **${{ steps.fix.outputs.fixes_applied }}** auto-fixes. PR opened for review." >> $GITHUB_STEP_SUMMARY
          if [ -f ".seo-pr-body.md" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            cat .seo-pr-body.md >> $GITHUB_STEP_SUMMARY
          fi
